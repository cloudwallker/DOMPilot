<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Form fixture</title>
</head>
<body>
  <h1>Registration</h1>
  <form id="registration">
    <label for="name">Name</label>
    <input id="name" name="name" type="text">
    <label for="accept">
      <input id="accept" name="accept" type="checkbox">
      Accept
    </label>
    <button type="submit">Submit</button>
  </form>
  <p id="result" role="status" aria-live="polite"></p>
  <script>
    document.querySelector('#registration').addEventListener('submit', function (event) {
      event.preventDefault();
      const name = document.querySelector('#name').value;
      const accepted = document.querySelector('#accept').checked;
      document.querySelector('#result').textContent =
        'Submitted: ' + name + '; ' + (accepted ? 'accepted' : 'not accepted');
    });
  </script>
</body>
</html>
