<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dynamic fixture</title>
</head>
<body>
  <h1>Dynamic editor</h1>
  <button id="reveal" type="button">Reveal</button>
  <div id="editor"></div>
  <p id="result" role="status" aria-live="polite"></p>
  <script>
    document.querySelector('#reveal').addEventListener('click', function () {
      const reveal = document.querySelector('#reveal');
      reveal.disabled = true;
      window.setTimeout(function () {
        const editor = document.querySelector('#editor');
        const label = document.createElement('label');
        label.htmlFor = 'dynamic-text';
        label.textContent = 'Dynamic text';
        const input = document.createElement('input');
        input.id = 'dynamic-text';
        input.name = 'dynamic-text';
        const save = document.createElement('button');
        save.type = 'button';
        save.textContent = 'Save';
        save.addEventListener('click', function () {
          document.querySelector('#result').textContent = 'Saved: ' + input.value;
        });
        editor.append(label, input, save);
      }, 100);
    });
  </script>
</body>
</html>
