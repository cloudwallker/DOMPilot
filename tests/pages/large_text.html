<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Large text fixture</title>
</head>
<body>
  <h1>Library search with a long document</h1>
  <form id="search-form">
    <label for="query">Search</label>
    <input id="query" name="query" type="search">
    <button type="submit">Search</button>
  </form>
  <p id="result" role="status" aria-live="polite"></p>
  <article id="unrelated" aria-label="Unrelated reference text"></article>
  <script>
    const requested = Number(new URLSearchParams(location.search).get('words'));
    const wordCount = Number.isFinite(requested) && requested > 0
      ? Math.min(Math.floor(requested), 500000)
      : 12000;
    const words = ['granite', 'tundra', 'harbor', 'copper', 'meadow', 'orbit'];
    const blocks = [];
    for (let offset = 0; offset < wordCount; offset += 120) {
      const block = [];
      for (let index = offset; index < Math.min(offset + 120, wordCount); index++) {
        block.push(words[index % words.length]);
      }
      blocks.push('<p>' + block.join(' ') + '</p>');
    }
    document.querySelector('#unrelated').innerHTML = blocks.join('');
    document.querySelector('#search-form').addEventListener('submit', function (event) {
      event.preventDefault();
      document.querySelector('#result').textContent = 'Search results: Transformer';
    });
  </script>
</body>
</html>
