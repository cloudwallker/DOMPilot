<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Disabled controls fixture</title>
  <style>.hidden-by-css { display: none; }</style>
</head>
<body>
  <h1>Control availability</h1>
  <button type="button" hidden>Hidden attribute</button>
  <button type="button" class="hidden-by-css">Hidden CSS</button>
  <button type="button" disabled>Disabled native</button>
  <button type="button" aria-disabled="true">Disabled ARIA</button>
  <label for="readonly">Read only</label>
  <input id="readonly" value="fixed" readonly>
  <label for="disabled-input">Disabled input</label>
  <input id="disabled-input" value="fixed" disabled>
  <label for="enabled">Enabled input</label>
  <input id="enabled">
  <button id="enabled-button" type="button">Enabled action</button>
</body>
</html>
